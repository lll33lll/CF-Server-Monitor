# Cloudflare Workers production configuration for this deployment
# Automatic deployments are handled by GitHub Actions from main.
name = "cf-server-monitor"
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
routes = [
  { pattern = "accasd.kdns.fr", custom_domain = true }
]

# Preserve runtime secrets (especially API_SECRET) on future deployments.
keep_vars = true

# Scheduled jobs (UTC): offline/resource checks every minute; maintenance hourly.
[triggers]
crons = ["*/1 * * * *", "0 * * * *"]

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "server-monitor-db"
database_id = "799e85b6-b86d-4fa5-9d7b-91baa2d22b6a"

[[durable_objects.bindings]]
name = "METRICS_BROADCASTER"
class_name = "MetricsBroadcaster"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MetricsBroadcaster"]

[vars]
CORS_ALLOWED_ORIGINS = "https://accasd.kdns.fr"

[dev]
port = 8787
local_protocol = "https"
