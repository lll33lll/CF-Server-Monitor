name: Upstream Sync

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.repository.fork
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main
        id: sync
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config merge.keepLocal.name "Keep deployment-specific files"
          git config merge.keepLocal.driver true
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/huilang-me/CF-Server-Monitor.git
          git fetch --no-tags upstream main

          before=$(git rev-parse HEAD)
          git merge --no-edit upstream/main
          after=$(git rev-parse HEAD)

          if [ "$before" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Fork is already current."
          else
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Merged and pushed upstream changes."
          fi

      - name: Check deployment credential
        id: deploy_auth
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -n "$CF_API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "CF_API_TOKEN is not configured. Synced code was not deployed."
          fi

      - name: Set up Node.js
        if: (steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch') && steps.deploy_auth.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: (steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch') && steps.deploy_auth.outputs.enabled == 'true'
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        if: (steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch') && steps.deploy_auth.outputs.enabled == 'true'
        run: npm run build:frontend

      - name: Deploy existing Worker
        if: (steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch') && steps.deploy_auth.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: 017c037119fdc461098ac4fe0dd96e4d
          wranglerVersion: "4"
          command: deploy --keep-vars
